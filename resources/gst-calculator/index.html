<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact us - S. S. Chauhan & Company | Chartered Accountants</title>
  <meta name="description" content="Premier chartered accounting firm specializing in audit, tax, and business advisory services with 7+ years of excellence.">

  <link rel="preload" href="https://cdn.tailwindcss.com" as="script">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/tailwind-config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="stylesheet" href="/assets/css/main.css">

</head>

<body class="font-sans bg-light text-gray-800 dark:bg-dark dark:text-gray-200 transition-colors duration-300">
  
  <div id="header"></div>
    <div class="custom-spacer"></div>

<section class="page-heading">
  <h1>GST Calculator</h1>
</section>

<main class="max-w-3xl mx-auto text-center">

    
    <div class="bg-white dark:bg-gray-800 text-left shadow-lg rounded-lg p-6 mb-6">


        <div class="mb-6">
            <h3 class="text-lg font-medium mb-3">Calculate GST (Add GST to Base Amount)</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="baseAmount" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Base Amount:</label>
                    <input type="number" id="baseAmount" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700 dark:text-gray-200 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g., 1000" min="0">
                </div>
                <div>
                    <label for="gstRateAdd" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">GST Rate (%):</label>
                    <select id="gstRateAdd" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700 dark:text-gray-200 focus:ring-blue-500 focus:border-blue-500">
                        <option value="0">0%</option>
                        <option value="5">5%</option>
                        <option value="12">12%</option>
                        <option value="18" selected>18%</option>
                        <option value="28">28%</option>
                        <option value="custom">Custom</option>
                    </select>
                    <input type="number" id="customGstRateAdd" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700 dark:text-gray-200 focus:ring-blue-500 focus:border-blue-500 mt-2 hidden" placeholder="Enter custom rate">
                </div>
            </div>
            <div class="mt-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Supply Type:</label>
                <div class="flex items-center space-x-4">
                    <label class="inline-flex items-center">
                        <input type="radio" name="supplyTypeAdd" value="inter" class="form-radio text-blue-600" checked>
                        <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Inter-state (IGST)</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="supplyTypeAdd" value="intra" class="form-radio text-blue-600">
                        <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Intra-state (CGST + SGST)</span>
                    </label>
                </div>
            </div>
            <div class="flex space-x-2 mt-4">
                <button id="calculateAddGST" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-150 ease-in-out">Calculate</button>
                <button id="resetAddGST" class="flex-1 bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition duration-150 ease-in-out">Reset</button>
            </div>

            <div class="mt-4 p-4 bg-gray-100 dark:bg-gray-700 rounded-md">
                <p class="text-sm text-gray-700 dark:text-gray-300 mb-1">
                    <span id="gstTypeAddedLabel" class="font-semibold text-gray-900 dark:text-gray-100">IGST Amount:</span> <span id="gstAmountAdded" class="font-semibold text-gray-900 dark:text-gray-100">0.00</span>
                </p>
                <p class="text-sm text-gray-700 dark:text-gray-300 mb-1 hidden" id="cgstAddedRow">CGST Amount: <span id="cgstAmountAdded" class="font-semibold text-gray-900 dark:text-gray-100">0.00</span></p>
                <p class="text-sm text-gray-700 dark:text-gray-300 mb-1 hidden" id="sgstAddedRow">SGST Amount: <span id="sgstAmountAdded" class="font-semibold text-gray-900 dark:text-gray-100">0.00</span></p>
                <p class="text-sm text-gray-700 dark:text-gray-300">Total Amount: <span id="totalAmountAdded" class="font-semibold text-gray-900 dark:text-gray-100">0.00</span></p>
            </div>
        </div>

        <div class="mb-4">
            <h3 class="text-lg font-medium mb-3">Calculate GST (From Amount Including GST)</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="totalAmountInclusive" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Amount Including GST:</label>
                    <input type="number" id="totalAmountInclusive" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700 dark:text-gray-200 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g., 1180" min="0">
                </div>
                <div>
                    <label for="gstRateRemove" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">GST Rate (%):</label>
                    <select id="gstRateRemove" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700 dark:text-gray-200 focus:ring-blue-500 focus:border-blue-500">
                        <option value="0">0%</option>
                        <option value="5">5%</option>
                        <option value="12">12%</option>
                        <option value="18" selected>18%</option>
                        <option value="28">28%</option>
                        <option value="custom">Custom</option>
                    </select>
                    <input type="number" id="customGstRateRemove" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-700 dark:text-gray-200 focus:ring-blue-500 focus:border-blue-500 mt-2 hidden" placeholder="Enter custom rate">
                </div>
            </div>
            <div class="mt-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Supply Type:</label>
                <div class="flex items-center space-x-4">
                    <label class="inline-flex items-center">
                        <input type="radio" name="supplyTypeRemove" value="inter" class="form-radio text-blue-600" checked>
                        <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Inter-state (IGST)</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="supplyTypeRemove" value="intra" class="form-radio text-blue-600">
                        <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Intra-state (CGST + SGST)</span>
                    </label>
                </div>
            </div>
            <div class="flex space-x-2 mt-4">
                <button id="calculateRemoveGST" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-150 ease-in-out">Calculate</button>
                <button id="resetRemoveGST" class="flex-1 bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition duration-150 ease-in-out">Reset</button>
            </div>

            <div class="mt-4 p-4 bg-gray-100 dark:bg-gray-700 rounded-md">
                <p class="text-sm text-gray-700 dark:text-gray-300 mb-1">
                    <span id="gstTypeRemovedLabel" class="font-semibold text-gray-900 dark:text-gray-100">IGST Amount:</span> <span id="gstAmountRemoved" class="font-semibold text-gray-900 dark:text-gray-100">0.00</span>
                </p>
                <p class="text-sm text-gray-700 dark:text-gray-300 mb-1 hidden" id="cgstRemovedRow">CGST Amount: <span id="cgstAmountRemoved" class="font-semibold text-gray-900 dark:text-gray-100">0.00</span></p>
                <p class="text-sm text-gray-700 dark:text-gray-300 mb-1 hidden" id="sgstRemovedRow">SGST Amount: <span id="sgstAmountRemoved" class="font-semibold text-gray-900 dark:text-gray-100">0.00</span></p>
                <p class="text-sm text-gray-700 dark:text-gray-300">Net Amount (Before GST): <span id="netAmountRemoved" class="font-semibold text-gray-900 dark:text-gray-100">0.00</span></p>
            </div>
        </div>
    </div>
</div>
  </main>

  <div id="footer"></div>

  <script>
fetch("/components/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
      if (window.initMobileMenu) initMobileMenu(); // ✅ now safe to call!
      if (window.Alpine) Alpine.initTree(document.getElementById("header"));
    });
    fetch("/components/footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("footer").innerHTML = data);
  </script>
  
  <script src="/assets/js/theme-toggle.js"></script>
  <script src="/assets/js/jquery-1.9.1.min.js"></script> 
  <script>
    AOS.init();
    function redirectToForm() {
      window.open("https://forms.gle/npHCDkm6aNybrtQh7", "_blank");
    }

    // GST Calculator JavaScript
    $(document).ready(function() {
        // Show/hide custom GST rate input for 'Add GST' section
        $('#gstRateAdd').change(function() {
            if ($(this).val() === 'custom') {
                $('#customGstRateAdd').removeClass('hidden');
            } else {
                $('#customGstRateAdd').addClass('hidden');
            }
        });

        // Show/hide custom GST rate input for 'Remove GST' section
        $('#gstRateRemove').change(function() {
            if ($(this).val() === 'custom') {
                $('#customGstRateRemove').removeClass('hidden');
            } else {
                $('#customGstRateRemove').addClass('hidden');
            }
        });

        // Function to update GST components display (IGST/CGST/SGST) for 'Add GST' section
        function updateAddGSTDisplay(gstAmount) {
            let supplyTypeAdd = $('input[name="supplyTypeAdd"]:checked').val();
            if (supplyTypeAdd === 'inter') {
                $('#gstTypeAddedLabel').text('IGST Amount:');
                $('#gstAmountAdded').text(gstAmount.toFixed(2));
                $('#cgstAddedRow').addClass('hidden');
                $('#sgstAddedRow').addClass('hidden');
            } else { // intra-state
                let cgstAmount = gstAmount / 2;
                let sgstAmount = gstAmount / 2;
                $('#gstTypeAddedLabel').text('Total GST Amount:'); // Can show total GST here
                $('#gstAmountAdded').text(gstAmount.toFixed(2));
                $('#cgstAmountAdded').text(cgstAmount.toFixed(2));
                $('#sgstAmountAdded').text(sgstAmount.toFixed(2));
                $('#cgstAddedRow').removeClass('hidden');
                $('#sgstAddedRow').removeClass('hidden');
            }
        }

        // Function to update GST components display (IGST/CGST/SGST) for 'Remove GST' section
        function updateRemoveGSTDisplay(gstAmount) {
            let supplyTypeRemove = $('input[name="supplyTypeRemove"]:checked').val();
            if (supplyTypeRemove === 'inter') {
                $('#gstTypeRemovedLabel').text('IGST Amount:');
                $('#gstAmountRemoved').text(gstAmount.toFixed(2));
                $('#cgstRemovedRow').addClass('hidden');
                $('#sgstRemovedRow').addClass('hidden');
            } else { // intra-state
                let cgstAmount = gstAmount / 2;
                let sgstAmount = gstAmount / 2;
                $('#gstTypeRemovedLabel').text('Total GST Amount:'); // Can show total GST here
                $('#gstAmountRemoved').text(gstAmount.toFixed(2));
                $('#cgstAmountRemoved').text(cgstAmount.toFixed(2));
                $('#sgstAmountRemoved').text(sgstAmount.toFixed(2));
                $('#cgstRemovedRow').removeClass('hidden');
                $('#sgstRemovedRow').removeClass('hidden');
            }
        }

        // Calculate GST (Add GST to Base Amount)
        $('#calculateAddGST').click(function() {
            let baseAmount = parseFloat($('#baseAmount').val());
            let gstRate = parseFloat($('#gstRateAdd').val());

            if ($('#gstRateAdd').val() === 'custom') {
                gstRate = parseFloat($('#customGstRateAdd').val());
            }

            if (isNaN(baseAmount) || baseAmount < 0) {
                alert('Please enter a valid Base Amount.');
                return;
            }
            if (isNaN(gstRate) || gstRate < 0) {
                alert('Please enter a valid GST Rate.');
                return;
            }

            let gstAmount = baseAmount * (gstRate / 100);
            let totalAmount = baseAmount + gstAmount;

            updateAddGSTDisplay(gstAmount); // Update GST breakdown
            $('#totalAmountAdded').text(totalAmount.toFixed(2));
        });

        // Reset for 'Add GST' section
        $('#resetAddGST').click(function() {
            $('#baseAmount').val(''); 
            $('#gstRateAdd').val('18'); 
            $('#customGstRateAdd').val('').addClass('hidden'); 
            $('input[name="supplyTypeAdd"][value="inter"]').prop('checked', true); 
            $('#gstAmountAdded').text('0.00'); 
            $('#cgstAmountAdded').text('0.00');
            $('#sgstAmountAdded').text('0.00');
            $('#totalAmountAdded').text('0.00');
            updateAddGSTDisplay(0); // Reset display to default IGST view
        });

        // Calculate GST (From Amount Including GST)
        $('#calculateRemoveGST').click(function() {
            let totalAmountInclusive = parseFloat($('#totalAmountInclusive').val());
            let gstRate = parseFloat($('#gstRateRemove').val());

            if ($('#gstRateRemove').val() === 'custom') {
                gstRate = parseFloat($('#customGstRateRemove').val());
            }

            if (isNaN(totalAmountInclusive) || totalAmountInclusive < 0) {
                alert('Please enter a valid Amount Including GST.');
                return;
            }
            if (isNaN(gstRate) || gstRate < 0) {
                alert('Please enter a valid GST Rate.');
                return;
            }

            let netAmount = totalAmountInclusive / (1 + (gstRate / 100));
            let gstAmount = totalAmountInclusive - netAmount;

            updateRemoveGSTDisplay(gstAmount); // Update GST breakdown
            $('#netAmountRemoved').text(netAmount.toFixed(2));
        });

        // Reset for 'Remove GST' section
        $('#resetRemoveGST').click(function() {
            $('#totalAmountInclusive').val(''); 
            $('#gstRateRemove').val('18'); 
            $('#customGstRateRemove').val('').addClass('hidden'); 
            $('input[name="supplyTypeRemove"][value="inter"]').prop('checked', true); 
            $('#gstAmountRemoved').text('0.00'); 
            $('#cgstAmountRemoved').text('0.00');
            $('#sgstAmountRemoved').text('0.00');
            $('#netAmountRemoved').text('0.00');
            updateRemoveGSTDisplay(0); // Reset display to default IGST view
        });

        // Recalculate on supply type change to update display immediately
        $('input[name="supplyTypeAdd"]').change(function() {
            $('#calculateAddGST').click(); // Trigger calculation for instant update
        });

        $('input[name="supplyTypeRemove"]').change(function() {
            $('#calculateRemoveGST').click(); // Trigger calculation for instant update
        });
    });
  </script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
