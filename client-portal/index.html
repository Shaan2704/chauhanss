<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S. S. Chauhan & Company | Chartered Accountants</title>
  <meta name="description" content="Premier chartered accounting firm specializing in audit, tax, and business advisory services with 7+ years of excellence.">

  <!-- Preload and Fonts -->
  <link rel="preload" href="https://cdn.tailwindcss.com" as="script">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind & Alpine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/tailwind-config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- AOS Animations -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="stylesheet" href="/assets/css/main.css">

</head>

<body class="font-sans bg-light text-gray-800 dark:bg-dark dark:text-gray-200 transition-colors duration-300">

  <!-- Header -->
  <div id="header"></div>

<!-- Spacer Div -->
<div class="custom-spacer"></div>

<section class="page-heading">
  <h1>Client Portal</h1>
</section>

<div class="max-w-3xl mx-auto px-4">
  <ul id="links" class="space-y-6 mb-16"></ul>
</div>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script>
fetch("/components/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
      if (window.initMobileMenu) initMobileMenu(); // ✅ now safe to call!
      if (window.Alpine) Alpine.initTree(document.getElementById("header"));
    });
    
    fetch("/components/footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("footer").innerHTML = data);

  // Load client links from JSON
  fetch("links.json")
    .then(res => res.json())
    .then(links => {
      const ul = document.getElementById("links");

      links.forEach(link => {
        const li = document.createElement("li");
	li.className = "mb-0 p-4 border rounded-lg shadow-sm bg-white";
        const a = document.createElement("a");

        a.href = link.href;
        a.textContent = link.text;
        a.classList.add("hover:underline", "hover:text-blue-800");

        li.appendChild(a);
        ul.appendChild(li);
      });
    })
    .catch(err => {
      console.error("Error loading client links:", err);
    });
  </script>

<script src="/assets/js/main.js"></script>
  <script>
    AOS.init();
  </script>

</body>
</html>
