<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Center</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eef1f5;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .file-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      width: 240px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    .file-card .icon {
      font-size: 40px;
      margin-bottom: 10px;
      color: #3498db;
    }

    .file-card h3 {
      font-size: 16px;
      margin: 10px 0;
      color: #333;
    }

    .download-button {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
    }

    .download-button:hover {
      background: #2980b9;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }
  </style>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>📁 Download Files</h1>
  <div class="container" id="fileContainer">
    <!-- File cards will be inserted here -->
  </div>

  <footer>&copy; 2025 Your Name or Organization</footer>

  <script>
    fetch('filelist.json')
      .then(response => response.json())
      .then(files => {
        const container = document.getElementById('fileContainer');
        files.forEach(file => {
          const iconMap = {
            excel: 'fa-file-excel',
            word: 'fa-file-word',
            text: 'fa-file-alt',
            pdf: 'fa-file-pdf',
            other: 'fa-file'
          };

          const iconClass = iconMap[file.type] || iconMap.other;

          const card = document.createElement('div');
          card.className = 'file-card';
          card.innerHTML = `
            <div class="icon"><i class="fas ${iconClass}"></i></div>
            <h3>${file.name}</h3>
            <a class="download-button" href="files/${file.name}" download>Download</a>
          `;
          container.appendChild(card);
        });
      })
      .catch(error => {
        document.getElementById('fileContainer').innerHTML = '<p>Unable to load files.</p>';
        console.error('Error loading file list:', error);
      });
  </script>

</body>
</html>
