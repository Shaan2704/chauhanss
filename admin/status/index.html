<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Due Dates Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h1>Work Due Dates Tracker</h1>

        <div class="controls">
            <div class="month-nav">
                <button id="prevMonthBtn" class="nav-button"><i class="fas fa-arrow-left"></i> Previous</button>
                <span id="currentMonthDisplay" class="month-display"></span>
                <button id="nextMonthBtn" class="nav-button">Next <i class="fas fa-arrow-right"></i></button>
            </div>
            
            </div>

        <div class="global-filters-container">
            <div class="filter-group">
                <label for="taskNameFilter">Task Name:</label>
                <input type="text" id="taskNameFilter" placeholder="Filter by Task Name">
            </div>
            <div class="filter-group">
                <label for="clientNameFilter">Client Name:</label>
                <input type="text" id="clientNameFilter" placeholder="Filter by Client Name">
            </div>
            <div class="filter-group">
                <label for="dueDateRangeFilter">Due Date Range:</label>
                <input type="text" id="dueDateRangeFilter" placeholder="Select Date Range">
                <button class="clear-date-button" data-target="dueDateRangeFilter"><i class="fas fa-times-circle"></i></button>
            </div>
        </div>

        <div class="summary-cards-container">
            <div class="summary-box" data-status="Pending">
                <span class="count" id="pendingTaskCount">0</span>
                <span class="label">Pending</span>
            </div>
            <div class="summary-box" data-status="In Progress">
                <span class="count" id="inProgressTaskCount">0</span>
                <span class="label">In Progress</span>
            </div>
            <div class="summary-box" data-status="Completed">
                <span class="count" id="completedTaskCount">0</span>
                <span class="label">Completed</span>
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 15px;">
            <a href="https://docs.google.com/spreadsheets/d/1JJzuV1e5bfKzD19YIpuOj6F-SunAhr6yttNgAirPN-g/edit?usp=sharing" target="_blank" class="sheet-link">
                <i class="fas fa-file-spreadsheet"></i>Open Google Sheet
            </a>
        </div>

        <div class="table-container">
            <table id="taskTable">
                <thead>
                    <tr id="tableHeaders">
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
