<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Pending Status</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="main-page">

  <!-- Header -->
<header class="top-header">
  <div class="header-left">
   <div class="logo-container"> <img src="/images/calogo.png" alt="Logo" class="logo"> </div>
    <div>
      <h1>S. S. CHAUHAN & COMPANY</h1>
      <p>Chartered Accountants</p>
    </div>
  </div>
  <button class="logout-button" onclick="logout()">Logout</button>
</header>


  <!-- Container for content -->
  <div class="container">

    <!-- Page Title -->
    <h1 style="text-align:center;">Task Pending Status</h1>

    <!-- User Info -->
    <div class="user-info">
      <p id="welcome"></p>
      <p id="role"></p>
    </div>

 <div style="text-align:center; margin: 10px 0;">
      <a href="https://docs.google.com/spreadsheets/d/16lTW8SWz_zqj-KoHF9jwHEIAUNAgKKvoF-XB7NcyFBc/edit?usp=sharing" target="_blank" style="font-size: 16px; color: #007BFF; text-decoration: none;">
        Click here to view the Google Sheet
      </a>
    </div>

    <!-- Filters -->
    <div id="filters">
      <input type="text" id="clientFilter" placeholder="Filter by Client...">
      <input type="text" id="taskFilter" placeholder="Filter by Task...">
      <input type="text" id="statusFilter" placeholder="Filter by Status...">
      <input type="date" id="dueDateFilter" placeholder="Due Before...">
    </div>


    <!-- Task Table -->
    <table id="taskTable">
      <thead>
        <tr>
          <th onclick="sortTable(0)">Client ⬍</th>
          <th onclick="sortTable(1)">Task ⬍</th>
          <th onclick="sortTable(2)">Due Date ⬍</th>
          <th onclick="sortTable(3)">Status ⬍</th>
          <th onclick="sortTable(4)">% Completed ⬍</th>
        </tr>
      </thead>
      <tbody id="taskBody"></tbody>
    </table>

  </div>

  <!-- Scripts -->
  <script src="script.js"></script>
  <script>
    window.onload = function() {
      const userData = localStorage.getItem('loggedInUser');
      if (!userData) {
        alert("You must log in first.");
        window.location.href = 'index.html';
        return;
      }

      const user = JSON.parse(userData);
      document.getElementById('welcome').textContent = `Welcome, ${user.name}!`;
      document.getElementById('role').textContent = `Role: ${user.role}`;
    }



    function logout() {
      localStorage.removeItem('loggedInUser');
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
