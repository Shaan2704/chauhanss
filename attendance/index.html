<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S. S. Chauhan & Company | Chartered Accountants</title>
  <meta name="description" content="Premier chartered accounting firm specializing in audit, tax, and business advisory services with 7+ years of excellence.">

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="stylesheet" href="/assets/css/main.css">

    
  <!-- Tailwind & Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/tailwind-config.js"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- AOS Animation -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>

  <!-- Header Include -->
  <div id="header"></div>
<body class="font-sans bg-light text-gray-800 dark:bg-dark dark:text-gray-200 transition-colors duration-300">
<!-- Spacer Div -->
<div class="custom-spacer"></div>

<section class="page-heading">
  <h1>Employee Attendance Portal</h1>
    <p>Mark your attendance below and ensure to enable your GPS</p>
</section>

  <!-- Content Container -->
  <section class="max-w-xl mx-auto my-10 bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-xl font-semibold text-center mb-4">Mark Attendance</h2>

  <input type="text" id="name" placeholder="Enter your Name" class="w-full p-3 mb-4 border border-gray-300 rounded-md" required />
  
  <textarea id="remarks" placeholder="In/Out?" class="w-full p-3 mb-4 border border-gray-300 rounded-md resize-none"></textarea>
  
  <button onclick="submitForm()" class="w-full bg-blue-600 text-white p-3 rounded-md hover:bg-blue-700 transition">
    Submit Attendance
  </button>

  <p id="status" class="status-message text-center mt-4"></p>
</section>


  <!-- Footer Include -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script>
    // Load Header & Footer
    fetch("/components/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
      if (window.initMobileMenu) initMobileMenu(); // ✅ now safe to call!
      if (window.Alpine) Alpine.initTree(document.getElementById("header"));
    });
    fetch("/components/footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("footer").innerHTML = data);

    
    // Init AOS
    AOS.init();
  </script>

<script>
  function submitForm() {
    const name = document.getElementById('name').value.trim();
    const remarks = document.getElementById('remarks').value.trim();
    const userAgent = navigator.userAgent;

    if (!name) {
      document.getElementById('status').innerText = '⚠️ Please enter your name.';
      return;
    }

    document.getElementById('status').innerText = '📡 Getting location...';

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        // Prepare data to send in POST request
        const data = new URLSearchParams();
        data.append('name', name);
        data.append('latitude', lat);
        data.append('longitude', lon);
        data.append('remarks', remarks);
        data.append('userAgent', userAgent);

        // Make the POST request to the Google Apps Script Web App
        fetch('https://script.google.com/macros/s/AKfycbxiSMeLu2k261GaNVKMtVc5PZI_GkmT2QVNY7goVxQYyLCRdAihdkZap-UJRpNpJuez/exec', {
          method: 'POST',
          body: data
        })
        .then(response => response.text())
        .then(responseText => {
          document.getElementById('status').innerText = responseText;
          document.getElementById('name').value = '';
          document.getElementById('remarks').value = '';
        })
        .catch(error => {
          document.getElementById('status').innerText = '❌ Error submitting attendance.';
        });
      }, function(error) {
        document.getElementById('status').innerText = '❌ Could not get location.';
      });
    } else {
      document.getElementById('status').innerText = '❌ Geolocation not supported.';
    }
  }
</script>

<script src="/assets/js/main.js"></script>
</body>
</html>
